<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{subject}}</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f5f5f3; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f5f5f3;">
        <tr>
            <td align="center" style="padding: 32px 16px;">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width: 600px; width: 100%; background-color: #ffffff; border: 1px solid #e5e5e3;">
                    <tr>
                        <td style="background-color: #1b365d; padding: 36px 40px; text-align: left;">
                            <img src="{{logoUrl}}" alt="IPEACE Consultancy" style="max-width: 120px; height: auto; margin-bottom: 20px;">
                            <h1 style="margin: 0; color: #ffffff; font-size: 22px; font-weight: 600; letter-spacing: -0.3px;">IPEACE Consultancy</h1>
                            <p style="margin: 6px 0 0; color: rgba(255,255,255,0.7); font-size: 14px;">Newsletter</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 40px;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom: 32px;">
                                <tr>
                                    <td style="font-size: 15px; color: #1a1a1a; line-height: 1.7;">
                                        {{{content}}}
                                    </td>
                                </tr>
                            </table>

                            <table role="presentation" cellpadding="0" cellspacing="0" style="margin: 0 auto 32px;">
                                <tr>
                                    <td>
                                        <a href="https://ipeace-consultancy.com" style="display: inline-block; background-color: #1b365d; color: #ffffff; padding: 10px 28px; text-decoration: none; font-size: 13px; font-weight: 500;">Visit our website</a>
                                    </td>
                                </tr>
                            </table>

                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-top: 1px solid #e5e5e3;">
                                <tr>
                                    <td style="padding-top: 20px;">
                                        <p style="margin: 0 0 8px; font-size: 12px; color: #999; line-height: 1.5;">You're receiving this newsletter because you subscribed to updates from IPEACE Consultancy.</p>
                                        <p style="margin: 0; font-size: 12px; color: #999; line-height: 1.5;"><a href="{{unsubscribeUrl}}" style="color: #1b365d; text-decoration: none;">Unsubscribe</a></p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 24px 40px; background-color: #f9f9f7; border-top: 1px solid #e5e5e3;">
                            <p style="margin: 0; font-size: 12px; color: #999; text-align: center;">&copy; 2025 IPEACE Consultancy. All rights reserved.</p>
                            <p style="margin: 4px 0 0; font-size: 12px; color: #999; text-align: center;">135 Baines Avenue, Avenues, Harare, Zimbabwe</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
